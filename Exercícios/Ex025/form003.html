<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.js" method="get" autocomplete="on">
        <p>
        <label for="iNome">Nome:</label>
        <input type="text" name="Nome" id="iNome" required maxlength="30" placeholder="Nome completo" autocomplete="name">
    </p>
    <p>
        <label for="iMedia">Média:</label>
        <input type="number" name="media" id="iMedia" min="0" max="10" placeholder="0 a 10" required step="0.5">
    </p>
    
    <p>
        <label for="imes">Período Letivo:</label>
        <input type="month" name="mes" id="iMes" value="2026-06">
    </p>
    <p>
        <label for="iDia">Dia da prova:</label>
        <input type="date" name="" id="">
    </p>
    <p>
        <label for="iHora">Horário da prova:</label>
        <input type="time" name="hora" id="iHora" value>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
    
</body>
</html>
