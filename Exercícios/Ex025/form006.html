<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.js" method="post">

        <p>
            <label for="cor">Cor:</label>
            <input type="color" name="cor" id="idCor">
        </p>

        <p>
            <label for="iNivel"> Nível de satisfação:</label>
            <input type="range" name="nivel" id="iNivel" min="1" max="5" value="2">
        </p>

        <p>
            <label for="iFoto">Foto do perfil</label>
            <input type="file" name="foto" id="iFoto">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    
</body>
</html>
