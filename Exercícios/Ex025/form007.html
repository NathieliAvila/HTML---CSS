<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.js" method="post" autocomplete="on">

        <p>
            <label for="iEst">Estado</label>
            <select name="estado" id="iEst">

                <option value="" selected>---Escolha---</option>
                <optgroup label="Região Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="ES">Espírito Santo</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                </optgroup>
            </select>
        </p>

        <label for="iProfissao">Profissão</label>
        <input type="text" name="profissao" id="iProfissao" list="lstProfissao">
        <datalist id="lstProfissao">
            <option value="ADM">Administrador</option>
            <option value="Cont">Contador</option>
            <option value="Dev">Desenvolvedor
                <option value="Prof">Professor</option>

            </option>
        </datalist>

        <p>
            <label for="iMsg">Mensagem</label><br>
            <textarea name="msg" id="iMsg" cols="30" rows="10"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
