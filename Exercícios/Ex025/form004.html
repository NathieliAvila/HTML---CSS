<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.js" method="get" autocomplete="on">
        
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="iNome">Nome:</label>
                <input type="text" name="nome" id="iNome" minlength="5" max="20" required>
            </p>
            <p>
                <label for="iEmail">E-mail:</label>
                <input type="email" name="email" id="iEmail" autocomplete="email">
            </p>
                <p>
            <label for="iTel">Telefone:</label>
                <input type="tel" name="tel" id="iTel" autocomplete="tel" pattern="^[0-9]{4}-[0-9]{4}$"></p>
        </fieldset>
    
  <!-- Estudar mais sobre regEx (expressões regulares) -->
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p></form>
    
</body>
</html>
