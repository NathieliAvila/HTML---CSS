<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.js" method="post" autocomplete="on">
        <p>
            <label for="iUsuario">Usuário</label>
            <input type="text" name="usuario" id="iUsuario" minlength="5" maxlength="15" placeholder="Nome do Usuário" autocomplete="username">
        </p>

        <p>
            <label for="iSenha">Senha</label>
            <input type="password" name="Senha" id="iSenha" required minlength="8" placeholder="Mínimo 8 letras" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar" required>
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
